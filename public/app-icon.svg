<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" role="img" aria-label="The pdf-iq app icon">
  <!--
    The app icon: the same folded page as public/mark.svg, on the warm ground the launcher icon uses, from the app
    repo's images/icon/pdf-iq-icon.svg (26 September 2026).

    THIS FILE IS THE SOURCE OF THE GEOMETRY for /app/'s share card: tools/og-images.mjs parses the polygons out of
    it and hands them to the rasteriser, so the card cannot drift from the drawing. Nothing on the site renders the
    file itself — docs/sale-go-live.md §4 carries the re-compare for listing day.

    What was here before was "the seam": one navy mass cut on the anti-diagonal with amber through the gap. It is
    gone, and so is the site's 135-degree split, because there is one mark now. The whole argument for the old
    icon's absence from the hero and the homepage tile — that at 96px the gap read as a stripe and at 24px as a
    dark square — was about that drawing and does not carry to this one. Both placements are worth re-testing by
    rendering, which is how the previous answer was arrived at.
  -->
  <rect width="108" height="108" fill="#FAF8F4" />
  <polygon points="34,29 56,29 74,47 74,79 34,79" fill="#1E2A38" />
  <polygon points="56,29 56,47 74,47" fill="#C87A1E" />
</svg>
