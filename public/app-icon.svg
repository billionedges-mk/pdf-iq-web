<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" role="img" aria-label="The pdf-iq app icon">
  <!--
    The app icon, as the launcher composes it: a cream page with an amber folded corner and three navy rules, on a
    solid navy ground. Rebuilt from the app repo's images/icons/ic_launcher_background.xml and
    ic_launcher_foreground.xml (26 September 2026), because pdf-iq-icon.svg no longer exists — the icon's reference
    there is now the two launcher vectors and a 512px PNG.

    INVERTED from public/mark.svg, and both are right. The launcher ground is navy, so the page is cream; the site's
    chrome is white, so the page is navy. The background vector's own note says what the inversion is for: the
    previous amber ground made the fold vanish.

    Coordinates are the foreground vector's, unchanged: page 32,27 to 76,81 with the fold leg 20dp, rules 5dp tall
    at y=53, 63 and 73. Nothing on the site renders this file; it is the reference copy, and docs/sale-go-live.md §4
    carries the by-eye re-compare for listing day. The share cards read public/mark.svg instead.
  -->
  <rect width="108" height="108" fill="#1E2A38" />
  <polygon points="32,27 56,27 76,47 76,81 32,81" fill="#FAF8F4" />
  <polygon points="56,27 56,47 76,47" fill="#C87A1E" />
  <rect x="40" y="53" width="28" height="5" fill="#1E2A38" />
  <rect x="40" y="63" width="28" height="5" fill="#1E2A38" />
  <rect x="40" y="73" width="18" height="5" fill="#1E2A38" />
</svg>
