<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="pdf-iq">
  <!--
    The mark: a folded page, navy sheet with an amber fold. One drawing for the site and the app, from the app
    repo's images/icon/pdf-iq-mark.svg (26 September 2026), which is the same file the app ships.

    It replaces two marks that were not the same drawing — the nav's 135-degree split and the launcher seam — and
    it is the reason both are gone. The dark-UI variant swaps the sheet to #EDEAE4 and keeps the fold; nothing on
    this site needs it yet.

    The provenance manifest on the original (about 8KB of C2PA metadata, against 230 bytes of drawing) is stripped
    here because this mark is inlined into the header of every page. The signed original stays in the app repo.
  -->
  <polygon points="3,1 13,1 21,9 21,23 3,23" fill="#1E2A38" />
  <polygon points="13,1 13,9 21,9" fill="#C87A1E" />
</svg>
