<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="pdf-iq">
  <!--
    The mark: a page with an amber folded corner and three rules of text, from the app repo's
    images/icons/pdf-iq-mark.svg (26 September 2026), the same drawing the app ships.

    INVERTED BETWEEN CONTEXTS, ON PURPOSE. Here the page is navy and the rules are cream, because this sits on the
    site's white chrome. The launcher icon is the other way round — a cream page with navy rules on a solid navy
    ground — and its own note says why the old amber ground had to go: on amber the fold would vanish. Both are the
    same mark; neither is the "correct" colouring of it. pdf-iq-mark-dark.svg in the app repo is this one inverted,
    for a dark surface, and nothing on this site needs it yet.

    It replaced the site's 135-degree split and the launcher seam, which were two different drawings. The rules
    arrived a few hours after the first version; the polygons did not change.

    The provenance manifest on the original (about 8KB of C2PA metadata against 300 bytes of drawing) is stripped
    here because this mark is inlined into the header of every page. The signed original stays in the app repo.
  -->
  <polygon points="3,1 13,1 21,9 21,23 3,23" fill="#1E2A38" />
  <polygon points="13,1 13,9 21,9" fill="#C87A1E" />
  <rect x="6" y="11" width="12" height="2" fill="#FAF8F4" />
  <rect x="6" y="15" width="12" height="2" fill="#FAF8F4" />
  <rect x="6" y="19" width="7" height="2" fill="#FAF8F4" />
</svg>
